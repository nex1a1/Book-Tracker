services:
  # 1. DEV backend (tsx watch, :3001)
  dev-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manga_tracker_dev_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
    ports:
      - "127.0.0.1:3001:3001" # this machine only: the API has no login
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - manga_net

  # 2. DEV frontend (Vite dev server + HMR, :5174)
  dev-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manga_tracker_dev_frontend
    restart: unless-stopped
    depends_on:
      - dev-backend
    environment:
      VITE_BACKEND_TARGET: http://dev-backend:3001
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - manga_net

  # 3. PROD: production build on :5175 (API + built frontend in one container, same data folder as dev).
  #    Start: docker compose --profile prod up -d --build prod
  prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: manga_tracker_prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5175:3001" # this machine only: the API has no login
    volumes:
      - ./backend/data:/app/data

networks:
  manga_net:
    driver: bridge
